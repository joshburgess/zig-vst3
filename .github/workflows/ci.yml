name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ZIG_VERSION: 0.16.0
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check retired comparison references
        run: scripts/check_retired_reference.sh
      - name: Check raw callback pointers
        run: |
          scripts/test_raw_callback_pointer_check.sh
          scripts/check_raw_callback_pointers.sh
      - name: Check production termination paths
        run: |
          scripts/test_production_termination_path_check.sh
          scripts/check_production_termination_paths.sh
      - name: Check prose punctuation
        run: |
          em_dash="$(printf '\342\200\224')"
          if grep -R -n "$em_dash" README.md CONTRIBUTING.md docs .github scripts; then
            echo "Use hyphen punctuation in prose instead of em dash characters." >&2
            exit 1
          fi

  test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      VSTGUI_VISUAL_TEST_ARGS: --skip-performance
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
          use-cache: ${{ matrix.os != 'windows-latest' }}
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            lame \
            libgtk-3-dev \
            libgtkmm-3.0-dev \
            libnetcdf-dev \
            libx11-dev \
            libxcb1-dev \
            libxcb-cursor-dev \
            libxcb-keysyms1-dev \
            libxcb-util-dev \
            libxcb-xkb-dev \
            libxkbcommon-x11-dev \
            vorbis-tools \
            xauth \
            xvfb
      - name: Detect Windows SDK libraries
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $libcFile = Join-Path $env:RUNNER_TEMP 'zig-libc.txt'
          $libcLines = zig libc
          [IO.File]::WriteAllText(
            $libcFile,
            ($libcLines -join "`n") + "`n",
            [Text.UTF8Encoding]::new($false)
          )
          zig libc $libcFile
          "ZIG_LIBC_FILE=$libcFile" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Prepare Windows MIDI SDK
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/prepare_windows_midi_sdk.ps1
      - name: Fetch pinned VST3 SDK
        shell: bash
        run: scripts/fetch_sdk.sh
      - name: Fetch CC BY HRTF fixtures
        if: runner.os == 'Linux'
        run: |
          scripts/fetch_hrtf_sofa_fixture.sh "$RUNNER_TEMP/viking-subj-A.sofa"
          scripts/fetch_hutubs_hrtf_sofa_fixture.sh "$RUNNER_TEMP/hutubs-pp1-measured.sofa"
      - name: Prepare independent MP3 sources
        if: runner.os == 'Linux'
        run: |
          scripts/fetch_androidx_vbri_fixture.sh "$RUNNER_TEMP/androidx-vbri.mp3"
          scripts/prepare_helix_mp3_encoder.sh "$RUNNER_TEMP/hmp3"
      - name: Test Windows UMP bridge
        if: runner.os == 'Windows'
        run: zig build test-winump -Dtarget=x86_64-windows-msvc --libc "$env:ZIG_LIBC_FILE"
      - name: Build
        if: runner.os != 'Windows'
        run: zig build
      - name: Build
        if: runner.os == 'Windows'
        run: zig build -Dtarget=x86_64-windows-msvc --libc "$env:ZIG_LIBC_FILE"
      - name: Test
        if: runner.os == 'macOS'
        run: zig build test
      - name: Test
        if: runner.os == 'Linux'
        env:
          ZIG_VST3_HUTUBS_SOFA_TEST_FILE: ${{ runner.temp }}/hutubs-pp1-measured.sofa
          ZIG_VST3_EXTERNAL_VBRI_TEST_FILE: ${{ runner.temp }}/androidx-vbri.mp3
          ZIG_VST3_HELIX_MP3_ENCODER: ${{ runner.temp }}/hmp3
          ZIG_VST3_VIKING_SOFA_TEST_FILE: ${{ runner.temp }}/viking-subj-A.sofa
          MP3_INTEROP_REQUIRE_EXTENDED: 1
          ZIG_VSTGUI_DIAGNOSTICS: 1
          VORBIS_QUALITY_REQUIRE_EXTERNAL: 1
          VSTGUI_RUN_VISUAL_TESTS: OFF
        run: xvfb-run -a zig build test
      - name: Test Debug native GUI ABI
        if: runner.os == 'Linux'
        env:
          ZIG_VSTGUI_DIAGNOSTICS: 1
        run: scripts/test_vstgui_debug_abi.sh
      - name: Test realtime DSP concurrency
        if: runner.os == 'Linux'
        run: zig build test-dsp-thread-sanitizer --summary all
      - name: Test
        if: runner.os == 'Windows'
        env:
          ZIG_VSTGUI_DIAGNOSTICS: 1
          VSTGUI_VISUAL_TEST_ARGS: --platform-smoke
        run: zig build test-windows-native -Dtarget=x86_64-windows-msvc --libc "$env:ZIG_LIBC_FILE"

  raw-api-abi:
    name: Raw API ABI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libgtkmm-3.0-dev \
            libx11-dev \
            libxcb1-dev \
            libxcb-cursor-dev \
            libxcb-keysyms1-dev \
            libxcb-util-dev \
            libxcb-xkb-dev \
            libxkbcommon-x11-dev
      - name: Fetch pinned VST3 SDK
        run: scripts/fetch_sdk.sh
      - name: Run raw API ABI checks
        run: zig build raw-api-abi

  validator:
    name: Validator (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Install Linux validator dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libgtkmm-3.0-dev \
            libx11-dev \
            libxcb1-dev \
            libxcb-cursor-dev \
            libxcb-keysyms1-dev \
            libxcb-util-dev \
            libxcb-xkb-dev \
            libxkbcommon-x11-dev
      - name: Fetch pinned VST3 SDK
        run: scripts/fetch_sdk.sh
      - name: Build Steinberg validator
        run: zig build validator
      - name: Validate example bundles
        run: zig build validate-examples
      - name: Upload validated bundles
        uses: actions/upload-artifact@v7
        with:
          name: validated-vst3-bundles-${{ matrix.os }}
          path: zig-out/bundle/
          if-no-files-found: error

  lv2-distribution:
    name: LV2 distribution
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 30
    container: archlinux:base
    steps:
      - name: Install validation and UI build dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            cmake \
            gcc \
            git \
            gtk3 \
            gtkmm3 \
            libx11 \
            lv2 \
            lv2lint \
            make \
            ninja \
            pkgconf \
            sord \
            xcb-util \
            xcb-util-cursor \
            xcb-util-keysyms \
            libxkbcommon \
            libxkbcommon-x11 \
            wayland-protocols
          pacman -Q lv2 lv2lint
      - uses: actions/checkout@v6
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Fetch pinned VST3 SDK
        run: scripts/fetch_sdk.sh
      - name: Validate LV2 distribution
        run: |
          zig build lint-lv2-mono-gain -Doptimize=ReleaseFast
          zig build lint-lv2-dynamic-topology -Doptimize=ReleaseFast
      - name: Upload validated LV2 bundle
        uses: actions/upload-artifact@v7
        with:
          name: validated-lv2-bundle
          path: |
            zig-out/bundle/zig_vst3_mono_gain.lv2/
            zig-out/bundle/zig_vst3_dynamic_topology.lv2/
          if-no-files-found: error

  pluginval:
    name: pluginval (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    env:
      PLUGINVAL_VERSION: v1.0.4
    steps:
      - uses: actions/checkout@v6
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Install pluginval (macOS)
        if: runner.os == 'macOS'
        run: |
          curl -fL -o pluginval.zip \
            "https://github.com/Tracktion/pluginval/releases/download/${PLUGINVAL_VERSION}/pluginval_macOS.zip"
          unzip -q pluginval.zip -d pluginval-dist
          echo "PLUGINVAL=$PWD/pluginval-dist/pluginval.app/Contents/MacOS/pluginval" >> "$GITHUB_ENV"
      - name: Install pluginval (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2t64 \
            libcurl4 \
            libfontconfig1 \
            libfreetype6 \
            libgl1 \
            libgtk-3-dev \
            libgtkmm-3.0-dev \
            libx11-dev \
            libxcb1-dev \
            libxcb-cursor-dev \
            libxcb-keysyms1-dev \
            libxcb-util-dev \
            libxcb-xkb-dev \
            libxcursor1 \
            libxext6 \
            libxinerama1 \
            libxkbcommon-x11-dev \
            libxrandr2 \
            xvfb
          curl -fL -o pluginval.zip \
            "https://github.com/Tracktion/pluginval/releases/download/${PLUGINVAL_VERSION}/pluginval_Linux.zip"
          unzip -q pluginval.zip -d pluginval-dist
          chmod +x pluginval-dist/pluginval
          echo "PLUGINVAL=$PWD/pluginval-dist/pluginval" >> "$GITHUB_ENV"
          echo "PLUGINVAL_ARGS=--skip-gui-tests" >> "$GITHUB_ENV"
      - name: Fetch pinned VST3 SDK
        run: scripts/fetch_sdk.sh
      - name: Run pluginval
        run: ${{ runner.os == 'Linux' && 'xvfb-run -a ' || '' }}zig build pluginval-examples
      - name: Run pluginval (strictness 10)
        run: ${{ runner.os == 'Linux' && 'xvfb-run -a ' || '' }}zig build pluginval-strict-examples

  cross-compile:
    name: Cross compile (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-linux-gnu
            bundle_step: bundle-examples-linux
            target_args: ''
          - target: aarch64-linux-gnu
            bundle_step: bundle-examples-linux
            target_args: -Dtarget=aarch64-linux-gnu
          - target: x86_64-macos
            bundle_step: bundle-examples
            target_args: -Dtarget=x86_64-macos
          - target: aarch64-macos
            bundle_step: bundle-examples
            target_args: -Dtarget=aarch64-macos
          - target: x86_64-windows-gnu
            bundle_step: bundle-examples-windows
            target_args: -Dtarget=x86_64-windows-gnu
          - target: aarch64-windows-gnu
            bundle_step: bundle-examples-windows
            target_args: -Dtarget=aarch64-windows-gnu
    steps:
      - uses: actions/checkout@v6
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Install native Linux GUI dependencies
        if: matrix.target == 'x86_64-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libgtkmm-3.0-dev \
            libx11-dev \
            libxcb1-dev \
            libxcb-cursor-dev \
            libxcb-keysyms1-dev \
            libxcb-util-dev \
            libxcb-xkb-dev \
            libxkbcommon-x11-dev
      - name: Fetch pinned VST3 SDK for native Linux GUI
        if: matrix.target == 'x86_64-linux-gnu'
        run: scripts/fetch_sdk.sh
      - name: Build target
        run: zig build ${{ matrix.target_args }}
      - name: Build target bundles
        run: zig build ${{ matrix.target_args }} ${{ matrix.bundle_step }}
      - name: Upload target bundles
        uses: actions/upload-artifact@v7
        with:
          name: vst3-bundles-${{ matrix.target }}
          path: zig-out/bundle/
          if-no-files-found: error

  pluginval-windows:
    name: pluginval (windows-latest)
    runs-on: windows-latest
    needs: cross-compile
    env:
      PLUGINVAL_VERSION: v1.0.4
    steps:
      - name: Download cross-built Windows bundles
        uses: actions/download-artifact@v7
        with:
          name: vst3-bundles-x86_64-windows-gnu
          path: bundles
      - name: Install pluginval
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/Tracktion/pluginval/releases/download/${env:PLUGINVAL_VERSION}/pluginval_Windows.zip" -OutFile pluginval.zip
          Expand-Archive -Path pluginval.zip -DestinationPath pluginval-dist
          $exe = Get-ChildItem -Path pluginval-dist -Recurse -Filter pluginval.exe | Select-Object -First 1
          if ($null -eq $exe) { Write-Error "pluginval.exe not found in release archive"; exit 1 }
          "PLUGINVAL_EXE=$($exe.FullName)" >> $env:GITHUB_ENV
      - name: Run pluginval
        shell: pwsh
        run: |
          # pluginval is a Windows GUI-subsystem app: the PowerShell call
          # operator does not block on it and its process exit code is
          # unreliable after otherwise clean runs. Use Start-Process -Wait to
          # block until it fully exits, then
          # read the verdict from its --output-dir log file (absolute path)
          # rather than trusting the exit code.
          $ErrorActionPreference = 'Continue'
          $logroot = Join-Path (Get-Location).Path 'pluginval-logs'
          function Invoke-Pluginval($strictness) {
            $bundles = Get-ChildItem -Path bundles -Directory -Filter *.vst3
            if ($bundles.Count -eq 0) { Write-Error "no Windows VST3 bundles found in artifact"; exit 1 }
            foreach ($bundle in $bundles) {
              Write-Host "== $($bundle.Name) (strictness $strictness) =="
              Remove-Item -Recurse -Force $logroot -ErrorAction SilentlyContinue
              New-Item -ItemType Directory -Path $logroot | Out-Null
              $pvArgs = @(
                '--validate-in-process',
                '--strictness-level', "$strictness",
                '--skip-gui-tests',
                '--output-dir', "$logroot",
                "$($bundle.FullName)"
              )
              Start-Process -FilePath "$env:PLUGINVAL_EXE" -ArgumentList $pvArgs -Wait -NoNewWindow
              $log = Get-ChildItem -Path $logroot -Recurse -Filter *.txt | Select-Object -First 1
              if ($null -eq $log) { Write-Error "no pluginval log produced for $($bundle.Name)"; exit 1 }
              $text = Get-Content $log.FullName -Raw
              Write-Host $text
              if (($text -match 'SUCCESS') -and ($text -notmatch 'FAILED')) {
                Write-Host "pluginval passed for $($bundle.Name)"
              } else {
                Write-Error "pluginval failed for $($bundle.Name)"
                exit 1
              }
            }
          }
          Invoke-Pluginval 5
          Invoke-Pluginval 10
          exit 0

  validator-windows:
    name: Validator (windows-latest)
    runs-on: windows-latest
    needs: cross-compile
    steps:
      - uses: actions/checkout@v6
      - name: Download cross-built Windows bundles
        uses: actions/download-artifact@v7
        with:
          name: vst3-bundles-x86_64-windows-gnu
          path: bundles
      - name: Fetch pinned VST3 SDK
        shell: bash
        run: scripts/fetch_sdk.sh
      - name: Build Steinberg validator
        shell: bash
        run: scripts/build_validator.sh
      - name: Validate Windows bundles
        shell: bash
        run: |
          set -eu
          shopt -s nullglob
          bundles=(bundles/*.vst3)
          if [ "${#bundles[@]}" -eq 0 ]; then
            echo "no Windows VST3 bundles found in artifact" >&2
            exit 1
          fi
          for bundle in "${bundles[@]}"; do
            echo "== $bundle =="
            # LoadLibraryW does not accept forward-slash separators, so pass a
            # native absolute Windows path to the validator.
            winpath="$(cygpath -w "$(pwd)/$bundle")"
            scripts/validate.sh "$winpath"
          done

name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ZIG_VERSION: 0.15.2
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check prose punctuation
        run: |
          em_dash="$(printf '\342\200\224')"
          if grep -R -n "$em_dash" README.md CONTRIBUTING.md PROJECT_BUILD_PLAN.md docs .github scripts; then
            echo "Use hyphen punctuation in prose instead of em dash characters." >&2
            exit 1
          fi

  test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
          use-cache: ${{ matrix.os != 'windows-latest' }}
      - name: Build
        run: zig build
      - name: Test
        run: zig build test

  layer1-abi:
    name: Layer 1 ABI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Fetch pinned VST3 SDK
        run: scripts/fetch_sdk.sh
      - name: Run Layer 1 ABI checks
        run: zig build layer1-abi

  validator:
    name: Validator (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Install Linux validator dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libgtkmm-3.0-dev libx11-dev
      - name: Fetch pinned VST3 SDK
        run: scripts/fetch_sdk.sh
      - name: Build Steinberg validator
        run: zig build validator
      - name: Validate example bundles
        run: zig build validate-examples
      - name: Upload validated bundles
        uses: actions/upload-artifact@v4
        with:
          name: validated-vst3-bundles-${{ matrix.os }}
          path: zig-out/bundle/
          if-no-files-found: error

  cross-compile:
    name: Cross compile (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-linux-gnu
            bundle_step: bundle-examples-linux
          - target: aarch64-linux-gnu
            bundle_step: bundle-examples-linux
          - target: x86_64-macos
            bundle_step: bundle-examples
          - target: aarch64-macos
            bundle_step: bundle-examples
          - target: x86_64-windows-gnu
            bundle_step: bundle-examples-windows
          - target: aarch64-windows-gnu
            bundle_step: bundle-examples-windows
    steps:
      - uses: actions/checkout@v6
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Build target
        run: zig build -Dtarget=${{ matrix.target }}
      - name: Build target bundles
        run: zig build -Dtarget=${{ matrix.target }} ${{ matrix.bundle_step }}
      - name: Upload target bundles
        uses: actions/upload-artifact@v4
        with:
          name: vst3-bundles-${{ matrix.target }}
          path: zig-out/bundle/
          if-no-files-found: error

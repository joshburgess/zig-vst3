name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.0
      - name: Verify pinned VST3 SDK checkout
        if: runner.os != 'Windows'
        run: scripts/fetch_sdk.sh
      - name: Verify pinned VST3 SDK checkout
        if: runner.os == 'Windows'
        run: .\scripts\fetch_sdk.ps1
      - name: Check TUID ABI
        if: runner.os != 'Windows'
        run: zig build tuid-abi
      - name: Check FUnknown C ABI
        if: runner.os != 'Windows'
        run: zig build funknown-abi
      - name: Check multi-interface C ABI
        if: runner.os != 'Windows'
        run: zig build multi-interface-abi
      - name: Phase 1 integration
        if: runner.os != 'Windows'
        run: zig build phase1
      - name: Build
        run: zig build
      - name: Test
        run: zig build test
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zig-vst3-stub-${{ matrix.os }}
          path: zig-out/

  cross-compile:
    name: Cross compile
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-linux
          - aarch64-linux
          - x86_64-macos
          - aarch64-macos
          - x86_64-windows
          - aarch64-windows
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.0
      - name: Build target
        run: zig build -Dtarget=${{ matrix.target }}

  validator:
    name: Build VST3 validator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.0
      - name: Fetch pinned VST3 SDK
        run: scripts/fetch_sdk.sh
      - name: Build validator
        run: zig build validator

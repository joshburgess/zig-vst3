name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.0
      - name: Verify pinned VST3 SDK checkout
        if: runner.os != 'Windows'
        run: scripts/fetch_sdk.sh
      - name: Verify pinned VST3 SDK checkout
        if: runner.os == 'Windows'
        run: .\scripts\fetch_sdk.ps1
      - name: Check TUID ABI
        if: runner.os != 'Windows'
        run: zig build tuid-abi
      - name: Check pluginbase ABI
        if: runner.os != 'Windows'
        run: zig build pluginbase-abi
      - name: Check IBStream ABI
        if: runner.os != 'Windows'
        run: zig build ibstream-abi
      - name: Check base string/error ABI
        if: runner.os != 'Windows'
        run: zig build base-strings-error-abi
      - name: Check base persistence ABI
        if: runner.os != 'Windows'
        run: zig build base-persistence-abi
      - name: Check base update/compatibility ABI
        if: runner.os != 'Windows'
        run: zig build base-update-compatibility-abi
      - name: Check IComponent ABI
        if: runner.os != 'Windows'
        run: zig build component-abi
      - name: Check IAudioProcessor ABI
        if: runner.os != 'Windows'
        run: zig build audio-processor-abi
      - name: Check IEditController ABI
        if: runner.os != 'Windows'
        run: zig build edit-controller-abi
      - name: Check parameter changes ABI
        if: runner.os != 'Windows'
        run: zig build parameter-changes-abi
      - name: Check events ABI
        if: runner.os != 'Windows'
        run: zig build events-abi
      - name: Check host/message ABI
        if: runner.os != 'Windows'
        run: zig build host-message-abi
      - name: Check plug view ABI
        if: runner.os != 'Windows'
        run: zig build plugview-abi
      - name: Check units ABI
        if: runner.os != 'Windows'
        run: zig build units-abi
      - name: Check MIDI mapping ABI
        if: runner.os != 'Windows'
        run: zig build midi-mapping-abi
      - name: Check note expression ABI
        if: runner.os != 'Windows'
        run: zig build note-expression-abi
      - name: Check capability/state ABI
        if: runner.os != 'Windows'
        run: zig build capability-state-abi
      - name: Check parameter helpers ABI
        if: runner.os != 'Windows'
        run: zig build parameter-helpers-abi
      - name: Check context menu ABI
        if: runner.os != 'Windows'
        run: zig build context-menu-abi
      - name: Check physical UI/channel context ABI
        if: runner.os != 'Windows'
        run: zig build physical-channel-abi
      - name: Check data exchange ABI
        if: runner.os != 'Windows'
        run: zig build data-exchange-abi
      - name: Check XML representation ABI
        if: runner.os != 'Windows'
        run: zig build representation-abi
      - name: Check Wayland frame ABI
        if: runner.os != 'Windows'
        run: zig build wayland-frame-abi
      - name: Check FUnknown C ABI
        if: runner.os != 'Windows'
        run: zig build funknown-abi
      - name: Check multi-interface C ABI
        if: runner.os != 'Windows'
        run: zig build multi-interface-abi
      - name: Phase 1 integration
        if: runner.os != 'Windows'
        run: zig build phase1
      - name: Build
        run: zig build
      - name: Test
        run: zig build test
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zig-vst3-stub-${{ matrix.os }}
          path: zig-out/

  cross-compile:
    name: Cross compile
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-linux
          - aarch64-linux
          - x86_64-macos
          - aarch64-macos
          - x86_64-windows
          - aarch64-windows
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.0
      - name: Build target
        run: zig build -Dtarget=${{ matrix.target }}

  validator:
    name: Build VST3 validator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.0
      - name: Fetch pinned VST3 SDK
        run: scripts/fetch_sdk.sh
      - name: Build validator
        run: zig build validator

name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ZIG_VERSION: 0.16.0
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check prose punctuation
        run: |
          em_dash="$(printf '\342\200\224')"
          if grep -R -n "$em_dash" README.md CONTRIBUTING.md docs .github scripts; then
            echo "Use hyphen punctuation in prose instead of em dash characters." >&2
            exit 1
          fi

  test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
          use-cache: ${{ matrix.os != 'windows-latest' }}
      - name: Build
        run: zig build
      - name: Test
        run: zig build test

  raw-api-abi:
    name: Raw API ABI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Fetch pinned VST3 SDK
        run: scripts/fetch_sdk.sh
      - name: Run raw API ABI checks
        run: zig build raw-api-abi

  validator:
    name: Validator (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Install Linux validator dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libgtkmm-3.0-dev libx11-dev
      - name: Fetch pinned VST3 SDK
        run: scripts/fetch_sdk.sh
      - name: Build Steinberg validator
        run: zig build validator
      - name: Validate example bundles
        run: zig build validate-examples
      - name: Upload validated bundles
        uses: actions/upload-artifact@v7
        with:
          name: validated-vst3-bundles-${{ matrix.os }}
          path: zig-out/bundle/
          if-no-files-found: error

  pluginval:
    name: pluginval (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    env:
      PLUGINVAL_VERSION: v1.0.4
    steps:
      - uses: actions/checkout@v6
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Install pluginval (macOS)
        if: runner.os == 'macOS'
        run: |
          curl -fL -o pluginval.zip \
            "https://github.com/Tracktion/pluginval/releases/download/${PLUGINVAL_VERSION}/pluginval_macOS.zip"
          unzip -q pluginval.zip -d pluginval-dist
          echo "PLUGINVAL=$PWD/pluginval-dist/pluginval.app/Contents/MacOS/pluginval" >> "$GITHUB_ENV"
      - name: Install pluginval (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb libfreetype6 libfontconfig1 libx11-6 libxext6 \
            libxinerama1 libxrandr2 libxcursor1 libgl1 libasound2t64 libcurl4
          curl -fL -o pluginval.zip \
            "https://github.com/Tracktion/pluginval/releases/download/${PLUGINVAL_VERSION}/pluginval_Linux.zip"
          unzip -q pluginval.zip -d pluginval-dist
          chmod +x pluginval-dist/pluginval
          echo "PLUGINVAL=$PWD/pluginval-dist/pluginval" >> "$GITHUB_ENV"
          echo "PLUGINVAL_ARGS=--skip-gui-tests" >> "$GITHUB_ENV"
      - name: Run pluginval
        run: ${{ runner.os == 'Linux' && 'xvfb-run -a ' || '' }}zig build pluginval-examples
      - name: Run pluginval (strictness 10)
        run: ${{ runner.os == 'Linux' && 'xvfb-run -a ' || '' }}zig build pluginval-strict-examples

  cross-compile:
    name: Cross compile (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-linux-gnu
            bundle_step: bundle-examples-linux
          - target: aarch64-linux-gnu
            bundle_step: bundle-examples-linux
          - target: x86_64-macos
            bundle_step: bundle-examples
          - target: aarch64-macos
            bundle_step: bundle-examples
          - target: x86_64-windows-gnu
            bundle_step: bundle-examples-windows
          - target: aarch64-windows-gnu
            bundle_step: bundle-examples-windows
    steps:
      - uses: actions/checkout@v6
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Build target
        run: zig build -Dtarget=${{ matrix.target }}
      - name: Build target bundles
        run: zig build -Dtarget=${{ matrix.target }} ${{ matrix.bundle_step }}
      - name: Upload target bundles
        uses: actions/upload-artifact@v7
        with:
          name: vst3-bundles-${{ matrix.target }}
          path: zig-out/bundle/
          if-no-files-found: error

  pluginval-windows:
    name: pluginval (windows-latest)
    runs-on: windows-latest
    needs: cross-compile
    env:
      PLUGINVAL_VERSION: v1.0.4
    steps:
      - name: Download cross-built Windows bundles
        uses: actions/download-artifact@v7
        with:
          name: vst3-bundles-x86_64-windows-gnu
          path: bundles
      - name: Install pluginval
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/Tracktion/pluginval/releases/download/${env:PLUGINVAL_VERSION}/pluginval_Windows.zip" -OutFile pluginval.zip
          Expand-Archive -Path pluginval.zip -DestinationPath pluginval-dist
          $exe = Get-ChildItem -Path pluginval-dist -Recurse -Filter pluginval.exe | Select-Object -First 1
          if ($null -eq $exe) { Write-Error "pluginval.exe not found in release archive"; exit 1 }
          "PLUGINVAL_EXE=$($exe.FullName)" >> $env:GITHUB_ENV
      - name: Run pluginval
        shell: pwsh
        run: |
          # pluginval prints SUCCESS but its process exit code is unreliable on
          # Windows (a non-zero code leaks from JUCE app teardown after a clean
          # run). Its console output also cannot be captured by redirecting the
          # process streams, so let it keep the console for display and read the
          # verdict from the --output-dir log file instead. Disable native
          # command error propagation so the non-zero exit does not abort the
          # script before that check runs.
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          function Invoke-Pluginval($strictness) {
            $bundles = Get-ChildItem -Path bundles -Directory -Filter *.vst3
            if ($bundles.Count -eq 0) { Write-Error "no Windows VST3 bundles found in artifact"; exit 1 }
            foreach ($bundle in $bundles) {
              Write-Host "== $($bundle.Name) (strictness $strictness) =="
              $logdir = "pluginval-logs"
              Remove-Item -Recurse -Force $logdir -ErrorAction SilentlyContinue
              New-Item -ItemType Directory -Path $logdir | Out-Null
              & "$env:PLUGINVAL_EXE" --validate-in-process --strictness-level $strictness --skip-gui-tests --output-dir $logdir "$($bundle.FullName)"
              $log = Get-ChildItem -Path $logdir -Filter *.txt | Select-Object -First 1
              if ($null -eq $log) { Write-Error "no pluginval log produced for $($bundle.Name)"; exit 1 }
              $text = Get-Content $log.FullName -Raw
              if (($text -match 'SUCCESS') -and ($text -notmatch 'FAILED')) {
                Write-Host "pluginval passed for $($bundle.Name)"
              } else {
                Write-Error "pluginval failed for $($bundle.Name)"
                exit 1
              }
            }
          }
          Invoke-Pluginval 5
      - name: Run pluginval (strictness 10)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          function Invoke-Pluginval($strictness) {
            $bundles = Get-ChildItem -Path bundles -Directory -Filter *.vst3
            if ($bundles.Count -eq 0) { Write-Error "no Windows VST3 bundles found in artifact"; exit 1 }
            foreach ($bundle in $bundles) {
              Write-Host "== $($bundle.Name) (strictness $strictness) =="
              $logdir = "pluginval-logs"
              Remove-Item -Recurse -Force $logdir -ErrorAction SilentlyContinue
              New-Item -ItemType Directory -Path $logdir | Out-Null
              & "$env:PLUGINVAL_EXE" --validate-in-process --strictness-level $strictness --skip-gui-tests --output-dir $logdir "$($bundle.FullName)"
              $log = Get-ChildItem -Path $logdir -Filter *.txt | Select-Object -First 1
              if ($null -eq $log) { Write-Error "no pluginval log produced for $($bundle.Name)"; exit 1 }
              $text = Get-Content $log.FullName -Raw
              if (($text -match 'SUCCESS') -and ($text -notmatch 'FAILED')) {
                Write-Host "pluginval passed for $($bundle.Name)"
              } else {
                Write-Error "pluginval failed for $($bundle.Name)"
                exit 1
              }
            }
          }
          Invoke-Pluginval 10
